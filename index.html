<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Reflecting Pool — Suki Engine</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="/vendor/suki-engine/client/suki/stakeLayout.css" />
    <link rel="stylesheet" href="/vendor/suki-engine/client/suki/betUi.css" />
    <link rel="stylesheet" href="/vendor/suki-engine/client/suki/betUiAutoplay.css" />
    <link rel="stylesheet" href="css/bet-ui.css" />
    <link rel="stylesheet" href="css/bet-ui-mobile.css" />
    <link rel="stylesheet" href="css/bet-ui-desktop.css" />
    <link rel="stylesheet" href="/vendor/suki-engine/client/suki/gameMenu.css" />
    <link rel="stylesheet" href="css/game-menu.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/modal-close.css" />
    <link rel="stylesheet" href="css/game-info-modal.css" />
    <link rel="stylesheet" href="css/autoplay-confirm.css" />
    <link rel="stylesheet" href="css/bet-picker-confirm.css" />
    <link rel="stylesheet" href="css/buy-bonus-confirm.css" />
    <link rel="stylesheet" href="css/feature-chrome.css" />
    <link rel="stylesheet" href="css/onboarding.css" />
    <style>
      /* Hide game chrome until JS mounts the preloader (avoids HTML shell flash). */
      .suki-stake-shell.suki-shell-booting > :not(.suki-game-preloader):not(.suki-game-onboarding):not(.suki-modal-overlay) {
        visibility: hidden;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@kap-solo/suki-engine/": "/vendor/suki-engine/",
          "pixi.js": "/vendor/npm/pixi.js/dist/pixi.min.mjs",
          "@esotericsoftware/spine-pixi-v8": "/vendor/npm/@esotericsoftware/spine-pixi-v8/dist/esm/spine-pixi-v8.mjs"
        }
      }
    </script>
    <script>
      function isIgnorableBootError(message) {
        var text = String(message || '');
        return text.indexOf('ResizeObserver loop') !== -1;
      }
      window.addEventListener('error', function (e) {
        if (isIgnorableBootError(e.message)) return;
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error';
          box.style.cssText = 'position:fixed;inset:12px;z-index:99999;margin:0;background:rgba(10,10,10,0.96);color:#ff8a8a;padding:16px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;pointer-events:auto;';
          document.body.appendChild(box);
        }
        document.querySelector('.suki-stake-shell')?.classList.remove('suki-shell-booting');
        box.textContent = 'Load error\n' + (e.filename || '') + '\n' + (e.message || String(e.error || e));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error';
          box.style.cssText = 'position:fixed;inset:12px;z-index:99999;margin:0;background:rgba(10,10,10,0.96);color:#ff8a8a;padding:16px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;pointer-events:auto;';
          document.body.appendChild(box);
        }
        document.querySelector('.suki-stake-shell')?.classList.remove('suki-shell-booting');
        var r = e.reason;
        box.textContent = 'Unhandled promise rejection\n' + (r && r.stack ? r.stack : (r && r.message ? r.message : String(r)));
      });
    </script>
  </head>
  <body>
    <main class="layout suki-stake-shell suki-shell-booting">
      <div class="suki-bg suki-bg-mobile-l" aria-hidden="true"></div>
      <div class="suki-bg suki-bg-mobile-ms" aria-hidden="true"></div>
      <div class="suki-bg suki-bg-landscape" aria-hidden="true"></div>

      <header class="suki-brand">
        <h1 id="game-title">Reflecting Pool</h1>
        <p class="subtitle" id="game-subtitle">5×5 cluster cascade</p>
      </header>

      <aside class="suki-flank-left" aria-hidden="true">
        <div class="suki-flank-slot"></div>
      </aside>

      <section class="suki-game-core">
        <div class="game-core-stack">
          <div class="stage" id="slot-stage" aria-live="polite">
            <div class="game-logo-mobile" aria-hidden="true">
              <img class="game-logo-mobile__img" src="assets/ui/game_logo.webp" alt="" decoding="async" />
            </div>
            <div id="slot-board" class="slot-canvas-host" aria-label="Slot reels"></div>
          </div>

          <div class="suki-controls-slot" id="bet-ui-root"></div>

          <section class="hud" id="balance-hud" aria-label="Balance and dev tools">
            <div class="stat hud-balance">
              <span class="label" id="balance-label">Balance</span>
              <span class="value" id="balance">$0.00</span>
            </div>
            <div class="hud-dev-actions" id="hud-dev-actions" hidden></div>
            <div class="stat" id="session-timer-stat" hidden>
              <span class="label">Session time</span>
              <span class="value tabular" id="session-timer">00:00</span>
            </div>
          </section>
        </div>

        <aside id="multiplier-panel" class="multiplier-panel" aria-label="Multiplier panel">
          <table class="multiplier-panel-table">
            <tbody id="multiplier-ledger" class="multiplier-ledger"></tbody>
          </table>
        </aside>
      </section>

      <div id="character-host" class="character-host" aria-hidden="true"></div>

      <p class="message" id="message" aria-live="polite">Connecting…</p>

      <footer class="suki-footer">
        <div id="replay-banner" class="replay-banner suki-replay-banner" hidden>
          <span class="replay-label">Replay</span>
          <span class="replay-note" id="replay-note">Recorded round for review only. No live play is made and your balance will not change.</span>
        </div>
      </footer>
    </main>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
